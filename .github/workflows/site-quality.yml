name: Site Quality

on:
  push:
    branches: [main, design/app-landing-v2-staging]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static site
        run: npm run validate
      - name: Verify v2 routes and disclosures
        run: npm run test:v2
